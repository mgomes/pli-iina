<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pli Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
      }

      #actions {
        display: flex;
        gap: 10px;
        padding: 0 26px 26px;
      }

      #actions.hidden {
        display: none;
      }

      .overlay-button {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-width: 156px;
        padding: 12px 16px;
        border: 0;
        border-radius: 16px;
        background: rgba(15, 17, 22, 0.82);
        color: #f7f2e9;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px) saturate(135%);
        text-align: center;
        pointer-events: auto;
        cursor: pointer;
      }

      .overlay-button:hover {
        background: rgba(24, 27, 34, 0.9);
        transform: translateY(-1px);
      }

      .overlay-button:active {
        transform: translateY(0);
      }

      .label {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        pointer-events: none;
      }

      .detail {
        font-size: 11px;
        line-height: 1.3;
        color: rgba(247, 242, 233, 0.72);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="actions" class="hidden"></div>
    <script>
      const root = document.getElementById("actions");

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function wireActions() {
        root.querySelectorAll("[data-action]").forEach((button) => {
          button.onclick = function (event) {
            event.preventDefault();
            event.stopPropagation();
            iina.postMessage("action", button.dataset.action);
          };
        });
      }

      function render(payload) {
        const state = payload && typeof payload === "object" ? payload : { visible: false, buttons: [] };
        if (!state.visible || !Array.isArray(state.buttons) || state.buttons.length === 0) {
          root.classList.add("hidden");
          root.innerHTML = "";
          return;
        }

        root.classList.remove("hidden");
        root.innerHTML = state.buttons
          .map((button) => {
            const detail = button.detail
              ? `<span class="detail" data-clickable>${escapeHTML(button.detail)}</span>`
              : "";
            return `<button class="overlay-button" type="button" data-clickable data-action="${escapeHTML(button.id)}"><span class="label" data-clickable>${escapeHTML(button.label)}</span>${detail}</button>`;
          })
          .join("");

        wireActions();
      }

      iina.onMessage("state", render);
    </script>
  </body>
</html>
